[project]
name = "otheloo-orientation-engine"
version = "1.0.0"
description = "Deterministic and explainable orientation recommendation engine for Otheloo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.40,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "numpy>=2.2,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orientation"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM","RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["orientation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

