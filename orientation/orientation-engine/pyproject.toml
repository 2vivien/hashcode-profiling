[project]
# V1 dependency contract; uv.lock is generated and committed by the lock workflow.
name = "otheloo-orientation-engine"
version = "1.0.0"
description = "Deterministic and explainable orientation recommendation engine for Otheloo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.40,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "numpy>=2.2,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<4",
  # Lecture des classeurs ROME (xlsx) publiés par France Travail en open data.
  "openpyxl>=3.1,<4",
  "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "hypothesis>=6.112,<7",
  "pytest-benchmark>=5,<6",
  "pytest-xdist>=3.6,<4",
  "httpx>=0.28,<1",
  "pre-commit>=4,<5",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orientation"]

[tool.ruff]
target-version = "py312"
line-length = 240
extend-exclude = ["src/**/*.pyi", "notebooks"]

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM","RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["orientation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.3,<5",
  "jupytext>=1.16,<2",
  "ipykernel>=6.29,<7",
  "ipywidgets>=8.1,<9",
  "matplotlib>=3.9,<4",
  "pandera>=0.20,<1",
]
ml = [
  "sentence-transformers>=5,<6",
  "lightgbm>=4.6,<5",
  "joblib>=1.4,<2",
]

[tool.coverage.run]
source = ["orientation"]
omit = ["*/tests/*", "src/**/*.pyi"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]
skips = ["B101"]

[tool.hypothesis]
deadline = 800
max_examples = 100
