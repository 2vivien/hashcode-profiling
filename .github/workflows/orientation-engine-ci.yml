name: orientation-engine-ci
on:
  push:
    paths: ["orientation/orientation-engine/**"]
  pull_request:
    paths: ["orientation/orientation-engine/**"]
permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orientation/orientation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv lock
      - run: uv sync
      - name: Auto-format validation branch
        if: github.event_name == 'pull_request' && github.head_ref == 'ci/v1-validation'
        run: |
          uv run ruff check . --fix || true
          uv run ruff format .
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(engine): apply Ruff formatting"
          git push origin HEAD:${{ github.head_ref }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python scripts/validate_catalog.py
