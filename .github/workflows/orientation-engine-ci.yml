name: orientation-engine-ci
on:
  push:
    paths: ["orientation/orientation-engine/**"]
  pull_request:
    paths: ["orientation/orientation-engine/**"]
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orientation/orientation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv lock
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python scripts/validate_catalog.py
